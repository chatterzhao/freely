  "overlap_groups": [
    {
      "id": "human-interruption",
      "members": [
        "freely-human-interruption-direct-answer",
        "freely-human-interruption-handling",
        "freely-human-interruption-manager-triage"
      ],
      "decision": "keep_separate",
      "entrypoint": "freely-human-interruption-manager-triage",
      "reason": "triage 做首次 reaction 路由、handling 做 manager 深度解释、direct-answer 由 runtime dispatcher 直接 claim；三者是同一 intake 链路的不同 owner，合并会让 dispatcher 无法按 reaction 选择 claim 路径。"
    },
    {
      "id": "worktree-governance",
      "members": [
        "freely-worktree-hygiene-supervision",
        "freely-worktree-maintenance-governance",
        "freely-multi-worktree-supervision"
      ],
      "decision": "keep_separate",
      "entrypoint": "freely-multi-worktree-supervision",
      "reason": "hygiene 判脏树阈值、maintenance 判 merge 顺序与退役、multi-worktree 判 fleet 批次；触发条件不同，本轮用矩阵登记唯一入口而非删文件，删并需索引兼容期（另立 raw）。"
    },
    {
      "id": "execution-flow",
      "members": [
        "freely-dev-loop-execution",
        "freely-test-execution",
        "freely-test-RED-execution"
      ],
      "decision": "keep_separate",
      "entrypoint": "freely-workflow-guarded-execution",
      "reason": "RED / dev / GREEN 是 freely-workflow-guarded-execution 明确区分的三个阶段，每个 SKILL.md 头部都有全链路定位；合并即破坏 TDD 顺序，不是重叠。"
    }
  ],

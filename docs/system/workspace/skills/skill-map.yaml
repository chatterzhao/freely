  "merge_groups": [
    {
      "id": "intake-routing",
      "entrypoint": "freely-human-interruption-manager-triage",
      "retired": [
        "freely-signal-intent-understanding",
        "freely-chat-issue-routing"
      ],
      "reason": "意图收敛与 chat 消息路由都是 intake 首次 triage 的前置判断，合并到唯一 triage 入口，避免 agent 连读三份 SKILL.md。"
    },

# =============================================================================
# Freely Tool Capability Registry
# =============================================================================
# Each [tool] section defines an AI CLI tool's complete capability description.
# Users can add new tools in ~/.freely/tool-registry.toml (takes priority).
# After adding a tool, set AI_TOOL = "toolname-apikey-slotname" in config.toml.
#
# ── [tool.slot] 字段说明 ──────────────────────────────────────────────────
#
# discovery      如何从 shell alias 提取 slot 路径:
#                  "alias_cli_arg"  → alias 用 CLI flag 如 --config /path
#                  "alias_env_var"  → alias 用 env var 如 OPENCODE_CONFIG=/path
# alias_key      alias 中的 flag/env-var 名 (如 "--config", "OPENCODE_CONFIG")
# config_file    凭证文件在 slot 目录下的相对路径 (如 "settings.json",
#                  "data/settings/providers.json")
# is_dir         slot 路径是目录(true)还是文件(false)
#
# bridge_config_env — 传给 ACP binary 的配置路径，按值前缀区分模式:
#   ""                  → 不传路径，直接从 config_file 提取 env vars 注入
#                         (适用于 claude: ACP binary 直接读 ANTHROPIC_* 等 env)
#   "--<flag>"          → CLI flag 模式，追加 [flag, slot_path] 到 acp.args
#                         (适用于 cline: cline --acp --config <path>)
#   "<ENV_VAR_NAME>"    → env var 模式，set ENV_VAR_NAME=<slot_path>
#                         (适用于 opencode: OPENCODE_CONFIG=<path>
#                           适用于 codex:   CODEX_HOME=<path>)
#
# post_init      启动后的钩子 ("" 或 "ensure_writable_roots" for codex)
#
# ── [tool.adapters] 字段说明 ──────────────────────────────────────────────────
#
# adapters.supported    该工具支持的适配器模式列表:
#                         "direct" — AI CLI 免交互模式。直接调用 AI CLI tool
#                           binary（如 claude -p、codex exec），通过 CLI flag
#                           传入 prompt 和参数。非交互式，一次性返回结果。
#                         "acp"    — Agent Client Protocol 模式。通过 ACP bridge
#                           (acp-bridge.py → claude-agent-acp) 与 AI agent
#                           通信。支持 session/resume/fork 等持久化会话能力。
#                         配置示例: supported = ["direct", "acp"]
#                         说明: 当前所有工具均支持 direct 和 acp 两种模式，
#                         但 direct 已弃用 (DEPRECATED)，推荐全部使用 acp。
#
# adapters.default      该工具的默认适配器。当前所有工具均为 "acp"。
#                         如果 direct CLI 启动逻辑未实现（见 tool-launchers.sh），
#                         运行时将提示 "direct 模式未实现，请配置 acp 模式"。
#
# adapters.launch_kinds  按适配器声明的启动方式:
#                         acp    = "fresh,resume,fork,fresh_with_handoff,prompt"
#                         direct = "fresh,resume,fresh_with_handoff"
# =============================================================================

# ── Claude Code ────────────────────────────────────────────────────────────

[claude]
display_name = "Claude Code"
binary_resolution = "path"          # "path" = find via PATH, "cache" = download
aliases = ["cc", "cc-use-codex-cli", "kiro-cli", "iflow", "claude-code"]
fallback_priority = 40              # lower = tried first during recovery
test_command = "claude -p 'say hi' --output-format text --dangerously-skip-permissions --bare --system-prompt ''"

[claude.acp]
binary = "claude-agent-acp"
args = []
bridge_socket_suffix = "acp"

[claude.permission]
mechanism = "session_set_mode"      # apply via ACP session/set_mode RPC
config_field = "permissionMode"     # field name in slot config
fallback_field = "permissions.defaultMode"

[claude.slot]
# claude 凭证通过 settings.json 的 env 字段直接注入 (ANTHROPIC_AUTH_TOKEN 等)
# ACP binary (claude-agent-acp) 不需要知道 slot 路径，只需 env vars
discovery = "alias_cli_arg"
alias_key = "--settings"
config_file = "settings.json"
is_dir = false
bridge_config_env = ""              # 空：直接提取 env vars 注入，不传路径
post_init = ""

[claude.config_schema]
file_format = "json"
file_name = "settings.json"

[claude.config_schema.fields]
permission_bypass = { path = "permissionMode", fallback_path = "permissions.defaultMode" }
model = { path = "model" }
api_base_url = { path = "env.ANTHROPIC_BASE_URL" }
# sandbox_mode — not declared (Claude uses --add-dir CLI flag, not config)
# writable_roots — not declared (Claude doesn't need this)

[claude.session]
supports_fork = true
supports_resume = true
id_format = "uuid"
directory_template = "${HOME}/.claude/projects/{slug}"
extract_regex = 'session[._]id[=:]\s*([a-f0-9-]{36})'

[claude.session.cli]
fresh = ["--session-id", "{id}"]
resume = ["--resume", "{target}"]
fork = ["--resume", "{parent}", "--fork-session", "--session-id", "{child}"]

[claude.adapters]
supported = ["direct", "acp"]
default = "acp"

[claude.adapters.launch_kinds]
acp = "fresh,resume,fork,fresh_with_handoff,prompt"
direct = "fresh,resume,fresh_with_handoff"

[claude.launch.direct]
binary = "claude"
args = ["-p"]
resume_flag = "--resume"
session_flag = "--session-id"
model_flag = "--model"
reasoning_flag = "--effort"
add_dir_boundary = true
add_dir_flag = "--add-dir"

[claude.launch.acp]
model_flag = "--model"
session_flag = "--session-id"
resume_flag = "--resume"

[claude.error_patterns]
auth_failure = ["401|402|403", "unauthorized", "invalid.?token|token.?expired", "authentication.?failed", "login required"]
quota_exhausted = ["insufficient_quota|quota exceeded", "insufficient balance|insufficient credit", "payment required"]
rate_limited = ["429 too many requests", "rate limit"]

[claude.auto_recovery]
command_name = "claude"
supports_same_tool_slot = true
supports_proxy_self_heal = false
requires_project_config = false

[claude.auto_recovery.failure_scope]
primary_rate_limit_exhausted = "slot_local"
auth_failure = "slot_local"
network_failure = "slot_local"

[claude.boundary]
project_config_surface = "none materialized by Freely yet"
launch_note = "adds `--add-dir {worktrees_root}`"
sync_note = "copy `.freely/config.toml`, then rematerialize wrapper in each new worktree"

[claude.process_match]
fragments = ["claude"]
fallback_token = "claude"
requires_project_owned_fallback = false

[claude.skill]
dir = "${HOME}/.claude/skills"

# ── Codex CLI ──────────────────────────────────────────────────────────────

[codex]
display_name = "Codex CLI"
binary_resolution = "cache"
aliases = []
fallback_priority = 10
test_command = "codex exec 'say hi' --max-tokens 50"

[codex.acp]
binary = "codex-acp"
args = []
auto_download = true
download_version = "0.15.0"
download_repo = "zed-industries/codex-acp"
bridge_socket_suffix = "acp"

[codex.permission]
mechanism = "slot_config_toml"
config_fields = ["approval_policy", "sandbox_mode"]

[codex.slot]
# codex 通过 CODEX_HOME 环境变量接收 slot 目录路径
# ACP binary (codex-acp) 读取 CODEX_HOME 找到 config.toml
discovery = "alias_env_var"
alias_key = "CODEX_HOME"
config_file = ""
is_dir = true
bridge_config_env = "CODEX_HOME"    # env var 模式：set CODEX_HOME=<slot_dir>
post_init = "ensure_writable_roots"

[codex.config_schema]
file_format = "toml"
file_name = "config.toml"

[codex.config_schema.fields]
permission_bypass = { path = "approval_policy" }
model = { path = "model" }
sandbox_mode = { path = "sandbox_mode" }
writable_roots = { path = "sandbox.writable_roots" }
api_base_url = { path = "openai_base_url" }

[codex.session]
supports_fork = true
supports_resume = true
id_format = "uuid"
directory_template = "${CODEX_HOME:-$HOME/.codex}/sessions"
extract_regex = '^session id: ([a-f0-9-]+)'

[codex.session.cli]
fresh = ["exec"]
resume = ["exec", "resume", "{target}"]
fork = ["exec", "resume", "{parent}"]

[codex.adapters]
supported = ["direct", "acp"]
default = "acp"

[codex.adapters.launch_kinds]
acp = "fresh,resume,fork,fresh_with_handoff,prompt"
direct = "fresh,resume,fresh_with_handoff"

[codex.launch.direct]
binary = "codex"
args = ["exec", "--skip-git-repo-check", "-C", "{project}"]
model_flag = "-m"
reasoning_flag = "-c"
add_dir_boundary = true
add_dir_flag = "--add-dir"

[codex.launch.acp]
model_flag = "--model"
session_flag = "--session-id"
resume_flag = "--resume"

[codex.error_patterns]
auth_failure = ["401|402 payment required|403 forbidden", "auth error: 402", "unauthorized|invalid.?token", "deactivated_workspace|workspace deactivated"]
quota_exhausted = ["429 too many requests|exceeded retry limit", "subscription.?expired|usage limit", "预扣费额度失败|剩余额度不足|余额不足|insufficient balance|quota exceeded"]
rate_limited = ["429 too many requests", "try again"]

[codex.auto_recovery]
command_name = "codex"
supports_same_tool_slot = true
supports_proxy_self_heal = true
requires_project_config = true

[codex.auto_recovery.failure_scope]
primary_rate_limit_exhausted = "slot_local"
auth_failure = "slot_local"
network_failure = "slot_local"

[codex.boundary]
project_config_surface = ".codex/config.toml"
launch_note = "adds `--add-dir {worktrees_root}`"
sync_note = "copy `.freely/config.toml`, then rematerialize `.codex/config.toml` and wrapper in each new worktree"

[codex.process_match]
fragments = ["codex exec", ".bun/bin/codex", "/codex/codex"]
fallback_token = "codex"
requires_project_owned_fallback = true

[codex.skill]
dir = "${HOME}/.codex/skills"

# ── OpenCode ───────────────────────────────────────────────────────────────

[opencode]
display_name = "OpenCode CLI"
binary_resolution = "path"
aliases = []
fallback_priority = 50
test_command = "opencode run 'say hi' --pure"

[opencode.acp]
binary = "opencode"
args = ["acp"]
bridge_socket_suffix = "opencode"

[opencode.permission]
mechanism = "env_var"
config_field = "permission"
env_var = "OPENCODE_CONFIG"

[opencode.slot]
# opencode 通过 OPENCODE_CONFIG 环境变量接收 settings.json 路径
# ACP binary (opencode acp) 读取 OPENCODE_CONFIG 找到 settings.json
discovery = "alias_env_var"
alias_key = "OPENCODE_CONFIG"
config_file = "settings.json"
is_dir = false
bridge_config_env = "OPENCODE_CONFIG" # env var 模式：set OPENCODE_CONFIG=<path>
post_init = ""

[opencode.config_schema]
file_format = "json"
file_name = "settings.json"

[opencode.config_schema.fields]
permission_bypass = { path = "permission" }
model = { path = "model" }
reasoning_effort = { path = "reasoning_effort" }
# sandbox_mode — not declared (industry default: none)

[opencode.session]
supports_fork = true
supports_resume = true
id_format = "ses_xxx"
directory_template = "${HOME}/.opencode/sessions"
extract_regex = 'service=session id=(ses_[A-Za-z0-9_]*)'

[opencode.session.cli]
fresh = ["--session", "{id}"]
resume = ["--session", "{target}", "--continue"]
fork = ["--session", "{parent}", "--fork"]

[opencode.adapters]
supported = ["direct", "acp"]
default = "acp"

[opencode.adapters.launch_kinds]
acp = "fresh,resume,fork,fresh_with_handoff,prompt"
direct = "fresh,resume,fresh_with_handoff"

[opencode.launch.direct]
binary = "opencode"
args = ["run", "--print-logs", "--dir", "{project}"]
session_flag = "-s"
resume_flag = "-s"
add_dir_boundary = false

[opencode.launch.acp]
model_flag = "--model"
session_flag = "--session-id"
resume_flag = "--resume"

[opencode.error_patterns]
auth_failure = []
quota_exhausted = []
rate_limited = []

[opencode.auto_recovery]
command_name = "opencode"
supports_same_tool_slot = true
supports_proxy_self_heal = false
requires_project_config = false

[opencode.auto_recovery.failure_scope]
auth_failure = "slot_local"
network_failure = "network_local"

[opencode.boundary]
project_config_surface = "none materialized by Freely yet"
launch_note = "passthrough wrapper only"
sync_note = "copy `.freely/config.toml`, then rematerialize wrapper in each new worktree"

[opencode.process_match]
fragments = ["opencode"]
fallback_token = "opencode"
requires_project_owned_fallback = false

[opencode.skill]
dir = "${HOME}/.config/opencode/skills"

# ── Cline ────────────────────────────────────────────────────────────────────

[cline]
display_name = "Cline"
binary_resolution = "path"          # npm install -g cline → in PATH
aliases = []
fallback_priority = 60              # after opencode, before hypothetical new tools
test_command = "cline 'say hi' --auto-approve true"

[cline.acp]
binary = "cline"
args = ["--acp"]                    # native ACP via @agentclientprotocol/sdk over stdio/ndjson
bridge_socket_suffix = "cline"

[cline.permission]
mechanism = "cli_flag"              # --yolo bypasses confirmations in non-interactive mode
config_field = "yolo"

[cline.slot]
# cline 不读任何 env var，只认 --config CLI flag（已验证：CLINE_CONFIG_DIR/
# CLINE_HOME/CLINE_CONFIG 等全部不生效，仅 --config <path> 有效）
# 因此 bridge_config_env 以 "--" 前缀触发 CLI flag 模式：
#   cline --acp --config <slot_dir>
#
# --config 指向 slot 目录根，providers.json 在 data/settings/ 子目录下
# session/db 等运行时数据也落在 --config 目录的 data/ 中（与 codex 类似）
discovery = "alias_cli_arg"
alias_key = "--config"
config_file = "data/settings/providers.json"
is_dir = true
bridge_config_env = "--config"      # CLI flag 模式：acp.args += ["--config", "<slot_dir>"]
post_init = ""

[cline.config_schema]
file_format = "json"
file_name = "providers.json"

[cline.config_schema.fields]
permission_bypass = { path = "yolo" }
model = { path = "model" }
api_base_url = { path = "baseURL" }
reasoning_effort = { path = "thinking" }

[cline.session]
supports_fork = true
supports_resume = true
id_format = "timestamp_nanoid"                   # e.g. 1782208464405_m02bu (13位时间戳_5字符nanoid)
directory_template = "${HOME}/.cline/data/sessions"
extract_regex = 'session[._]id[=:]\s*(\d{13}_[A-Za-z0-9]{5,10})'

[cline.session.cli]
fresh = []
resume = ["--id", "{target}"]
fork = ["--id", "{parent}"]

[cline.adapters]
supported = ["direct", "acp"]
default = "acp"

[cline.adapters.launch_kinds]
acp = "fresh,resume,fork,fresh_with_handoff,prompt"
direct = "fresh,resume,fresh_with_handoff"

[cline.launch.direct]
binary = "cline"
args = ["--yolo", "--cwd", "{project}"]
resume_flag = "--id"
session_flag = "--id"
model_flag = "--model"
reasoning_flag = "--thinking"
add_dir_boundary = false            # Cline uses --cwd; no separate --add-dir concept

[cline.launch.acp]
model_flag = "--model"
session_flag = "--session-id"
resume_flag = "--resume"

[cline.error_patterns]
auth_failure = ["401|402|403", "unauthorized", "invalid.?token|token.?expired", "authentication.?failed", "not authenticated", "login required"]
quota_exhausted = ["insufficient_quota|quota exceeded", "insufficient balance|insufficient credit", "payment required", "billing.*required"]
rate_limited = ["429 too many requests", "rate limit", "try again later"]

[cline.auto_recovery]
command_name = "cline"
supports_same_tool_slot = true
supports_proxy_self_heal = false
requires_project_config = false

[cline.auto_recovery.failure_scope]
primary_rate_limit_exhausted = "slot_local"
auth_failure = "slot_local"
network_failure = "slot_local"

[cline.boundary]
project_config_surface = "none materialized by Freely yet"
launch_note = "adds --cwd {project}"
sync_note = "copy `.freely/config.toml`, then rematerialize wrapper in each new worktree"

[cline.process_match]
fragments = ["cline"]
fallback_token = "cline"
requires_project_owned_fallback = false

[cline.skill]
dir = "${HOME}/.cline/skills"

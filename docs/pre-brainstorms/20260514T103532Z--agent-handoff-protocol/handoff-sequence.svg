<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1360" font-family="system-ui,-apple-system,sans-serif">
  <defs>
    <marker id="a-mgr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2563EB"/></marker>
    <marker id="a-run" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#D97706"/></marker>
    <marker id="a-wkr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#059669"/></marker>
    <marker id="a-db" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#6B7280"/></marker>
    <marker id="a-err" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#DC2626"/></marker>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1E293B"/><stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="1320" fill="#F8FAFC" rx="8"/>

  <!-- Title -->
  <rect x="0" y="0" width="1200" height="44" fill="url(#hdr)" rx="8"/>
  <rect x="0" y="32" width="1200" height="12" fill="url(#hdr)"/>
  <text x="600" y="28" text-anchor="middle" fill="#F1F5F9" font-size="17" font-weight="700">Handoff 协议完整时序 —— Manager 委派 → Worker 执行 → Manager 消费</text>

  <!-- ============================================================ -->
  <!-- Swimlane Headers -->
  <!-- ============================================================ -->
  <rect x="20" y="56" width="190" height="36" rx="5" fill="#2563EB"/>
  <text x="115" y="79" text-anchor="middle" fill="#FFF" font-size="12" font-weight="700">Manager AI</text>

  <rect x="230" y="56" width="190" height="36" rx="5" fill="#D97706"/>
  <text x="325" y="79" text-anchor="middle" fill="#FFF" font-size="12" font-weight="700">Runtime (freely)</text>

  <rect x="440" y="56" width="190" height="36" rx="5" fill="#059669"/>
  <text x="535" y="79" text-anchor="middle" fill="#FFF" font-size="12" font-weight="700">Worker AI</text>

  <rect x="650" y="56" width="190" height="36" rx="5" fill="#6B7280"/>
  <text x="745" y="79" text-anchor="middle" fill="#FFF" font-size="12" font-weight="700">handoffs 表</text>

  <rect x="860" y="56" width="320" height="36" rx="5" fill="#475569"/>
  <text x="1020" y="79" text-anchor="middle" fill="#FFF" font-size="12" font-weight="700">Worker Prompt 文件</text>

  <!-- Lifelines -->
  <line x1="115" y1="92" x2="115" y2="1340" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.4"/>
  <line x1="325" y1="92" x2="325" y2="1340" stroke="#D97706" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.4"/>
  <line x1="535" y1="92" x2="535" y2="1340" stroke="#059669" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.4"/>
  <line x1="745" y1="92" x2="745" y2="1340" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.4"/>
  <line x1="1020" y1="92" x2="1020" y2="1340" stroke="#475569" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.4"/>

  <!-- ============================================================ -->
  <!-- PHASE 1: Manager Patrol -->
  <!-- ============================================================ -->
  <rect x="20" y="100" width="1160" height="24" rx="4" fill="#2563EB" opacity="0.12"/>
  <text x="600" y="117" text-anchor="middle" font-size="12" font-weight="700" fill="#1E40AF">Phase 1: Manager Patrol → 决策 delegate_workers</text>

  <!-- 1.1 build_prompt → inject agent doc -->
  <rect x="245" y="134" width="160" height="18" rx="3" fill="#FED7AA"/>
  <text x="325" y="147" text-anchor="middle" font-size="9.5" fill="#7C2D12">build_prompt()</text>
  <path d="M245,143 L125,143" stroke="#D97706" stroke-width="1.2" fill="none" marker-end="url(#a-run)"/>
  <text x="150" y="139" font-size="8.5" fill="#D97706">① 注入 manager-agent.md 到 Prompt</text>

  <!-- 1.2 Manager reads state -->
  <path d="M125,161 L125,182" stroke="#2563EB" stroke-width="1.2" fill="none"/>
  <text x="44" y="177" font-size="8.5" fill="#2563EB">② 读 fleet 快照 + scan 数据 + handoffs 表</text>

  <!-- 1.3 Manager decides to delegate -->
  <path d="M125,196 L125,218" stroke="#2563EB" stroke-width="1.2" fill="none"/>
  <text x="44" y="214" font-size="8.5" fill="#2563EB">③ 决策: delegate_workers</text>

  <!-- 1.4 Manager creates prompt files -->
  <path d="M135,230 L1010,230" stroke="#475569" stroke-width="1.2" fill="none" marker-end="url(#a-db)"/>
  <text x="500" y="226" font-size="8.5" fill="#475569">④ 创建 worker prompt 文件 (Worktree/Branch/Task headers)</text>

  <!-- 1.5 Manager outputs handoff JSON -->
  <path d="M135,250 L315,250" stroke="#2563EB" stroke-width="1.5" fill="none" marker-end="url(#a-mgr)"/>
  <text x="190" y="246" font-size="8.5" fill="#2563EB">⑤ 输出 ```handoff JSON</text>

  <!-- JSON block hover -->
  <rect x="60" y="258" width="280" height="52" rx="3" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="0.8"/>
  <text x="70" y="274" font-size="9" fill="#4B5563" font-family="monospace">{"exit_kind":"delegate_workers",</text>
  <text x="70" y="288" font-size="9" fill="#4B5563" font-family="monospace"> "reason":"issue #344 需实现协议",</text>
  <text x="70" y="302" font-size="9" fill="#4B5563" font-family="monospace"> "worker_prompts_csv":"/path/w1.txt"}</text>

  <!-- ============================================================ -->
  <!-- PHASE 2: Runtime Parse & Consume -->
  <!-- ============================================================ -->
  <rect x="20" y="318" width="1160" height="24" rx="4" fill="#D97706" opacity="0.12"/>
  <text x="600" y="335" text-anchor="middle" font-size="12" font-weight="700" fill="#9A3412">Phase 2: Runtime 解析 JSON → 写入 DB → 启动 Worker</text>

  <!-- 2.1 parse_handoff_json -->
  <rect x="245" y="350" width="160" height="36" rx="3" fill="#FED7AA"/>
  <text x="325" y="364" text-anchor="middle" font-size="10" fill="#7C2D12" font-weight="600">parse_handoff_json()</text>
  <text x="325" y="379" text-anchor="middle" font-size="8.5" fill="#7C2D12">grep ```handoff 块</text>
  <path d="M135,368 L243,368" stroke="#D97706" stroke-width="1.2" fill="none" marker-end="url(#a-run)"/>

  <!-- 2.2 Validate -->
  <rect x="245" y="396" width="160" height="18" rx="3" fill="#FED7AA"/>
  <text x="325" y="409" text-anchor="middle" font-size="9.5" fill="#7C2D12">validate(json)</text>
  <line x1="325" y1="386" x2="325" y2="394" stroke="#D97706" stroke-width="1"/>

  <!-- 2.3 Validation failure path -->
  <rect x="400" y="396" width="260" height="18" rx="3" fill="#FEE2E2" stroke="#FCA5A5" stroke-width="0.8" stroke-dasharray="3,2"/>
  <text x="530" y="409" text-anchor="middle" font-size="8.5" fill="#991B1B">失败 → insert 结构化修复 handoff → goto ①</text>

  <!-- 2.4 Merge Runtime fields -->
  <path d="M325,418 L325,436" stroke="#D97706" stroke-width="1.2" fill="none"/>
  <text x="340" y="432" font-size="8.5" fill="#D97706">⑥ 合并: AI 7 字段 + Runtime 18 字段 → 完整 record</text>

  <!-- 2.5 INSERT manager record -->
  <path d="M335,450 L735,450" stroke="#D97706" stroke-width="1.5" fill="none" marker-end="url(#a-run)"/>
  <text x="470" y="446" font-size="8.5" fill="#D97706">⑦ INSERT manager record (status=completed)</text>

  <!-- 2.6 consume_delegate_workers -->
  <rect x="245" y="466" width="200" height="18" rx="3" fill="#FED7AA"/>
  <text x="345" y="480" text-anchor="middle" font-size="9.5" fill="#7C2D12">consume_delegate_workers()</text>
  <path d="M325,456 L345,464" stroke="#D97706" stroke-width="1" fill="none"/>

  <!-- 2.7 Read worker_prompts_csv -->
  <path d="M335,490 L1010,490" stroke="#D97706" stroke-width="1.2" fill="none" marker-end="url(#a-run)"/>
  <text x="600" y="486" font-size="8.5" fill="#D97706">⑧ 读 worker_prompts_csv → for each prompt_file</text>

  <!-- 2.8 Dedup check -->
  <path d="M335,506 L735,506" stroke="#D97706" stroke-width="1.2" fill="none" marker-end="url(#a-run)"/>
  <text x="460" y="502" font-size="8.5" fill="#D97706">⑨ 去重: 同 prompt_file + raw_key + status IN (launched,pending) → 跳过</text>

  <!-- 2.9 Parse headers + check worktree_active -->
  <path d="M335,520 L1010,520" stroke="#D97706" stroke-width="1.2" fill="none" marker-end="url(#a-run)"/>
  <text x="600" y="516" font-size="8.5" fill="#D97706">⑩ 解析 Worktree/Branch/intent_kind headers | worktree_has_active_worker(只查 launched)</text>

  <!-- 2.10 Compute previous_worker_handoff_id -->
  <path d="M335,534 L735,534" stroke="#D97706" stroke-width="1.2" fill="none" marker-end="url(#a-run)"/>
  <text x="460" y="530" font-size="8.5" fill="#D97706">⑪ 查同 raw_key 最近 completed worker → 写入 previous_worker_handoff_id</text>

  <!-- 2.11 INSERT worker record -->
  <path d="M335,548 L735,548" stroke="#D97706" stroke-width="1.5" fill="none" marker-end="url(#a-run)"/>
  <text x="460" y="544" font-size="8.5" fill="#D97706">⑫ INSERT worker record (status=pending, parent_handoff_id=manager_hid)</text>

  <!-- 2.12 Inject WORKER_HANDOFF_INJECT -->
  <path d="M335,572 L1010,572" stroke="#D97706" stroke-width="1.2" fill="none" marker-end="url(#a-run)"/>
  <text x="600" y="568" font-size="8.5" fill="#D97706">⑬ WORKER_HANDOFF_INJECT → prompt 文件追加 handoff_id + parent + prev_worker + completion</text>

  <!-- 2.13 Decide fork vs prompt -->
  <rect x="245" y="584" width="220" height="18" rx="3" fill="#EDE9FE"/>
  <text x="355" y="597" text-anchor="middle" font-size="9" fill="#5B21B6">⑭ 判断启动模式: session-store 有会话→prompt(delta) / 无→fork</text>

  <!-- 2.14 Launch worker -->
  <path d="M335,606 L525,606" stroke="#D97706" stroke-width="1.5" fill="none" marker-end="url(#a-run)"/>
  <text x="400" y="602" font-size="8.5" fill="#D97706">⑮ launch_worker (fork 新会话或 prompt delta turn)</text>

  <!-- 2.15 UPDATE → launched -->
  <path d="M335,620 L735,620" stroke="#D97706" stroke-width="1.2" fill="none" marker-end="url(#a-run)"/>
  <text x="460" y="616" font-size="8.5" fill="#D97706">⑯ UPDATE worker status=launched (WHERE status='pending')</text>

  <!-- 2.16 Auto-consume -->
  <path d="M335,636 L735,636" stroke="#7C3AED" stroke-width="1.8" fill="none" marker-end="url(#a-run)" stroke-dasharray="4,2"/>
  <text x="460" y="632" font-size="8.5" fill="#7C3AED">⑰ manager 新 handoff 创建触发 auto-consume: 消费上一轮 unconsumed worker</text>

  <!-- ============================================================ -->
  <!-- PHASE 3: Worker Execution -->
  <!-- ============================================================ -->
  <rect x="20" y="658" width="1160" height="24" rx="4" fill="#059669" opacity="0.12"/>
  <text x="600" y="675" text-anchor="middle" font-size="12" font-weight="700" fill="#14532D">Phase 3: Worker 接收任务 → 执行 → 汇报 (fork 首启 / delta 继续)</text>

  <!-- 3.1 build_prompt for worker -->
  <rect x="245" y="648" width="160" height="18" rx="3" fill="#FED7AA"/>
  <text x="325" y="661" text-anchor="middle" font-size="9.5" fill="#7C2D12">build_prompt()</text>
  <path d="M245,657 L535,657" stroke="#D97706" stroke-width="1.2" fill="none" marker-end="url(#a-run)"/>
  <text x="360" y="653" font-size="8.5" fill="#D97706">⑰ 注入 worker-agent.md + Task + HANDOFF_INJECT 上下文</text>

  <!-- 3.2 Worker reads, executes -->
  <path d="M545,670 L545,730" stroke="#059669" stroke-width="1.2" fill="none"/>
  <text x="554" y="700" font-size="9.5" fill="#059669">⑱ 读 Task + Worktree →</text>
  <text x="554" y="716" font-size="9.5" fill="#059669">执行代码/分析/测试 →</text>
  <text x="554" y="730" font-size="9.5" fill="#059669">产出 evidence</text>

  <!-- 3.3 Worker outputs JSON -->
  <path d="M545,742 L325,742" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-wkr)"/>
  <text x="400" y="738" font-size="8.5" fill="#059669">⑲ 输出 ```handoff JSON (worker_done)</text>

  <rect x="560" y="748" width="280" height="36" rx="3" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="0.8"/>
  <text x="570" y="764" font-size="9" fill="#4B5563" font-family="monospace">{"exit_kind":"worker_done",</text>
  <text x="570" y="778" font-size="9" fill="#4B5563" font-family="monospace"> "completion_summary":"handoff.py 字段重构</text>

  <!-- ============================================================ -->
  <!-- PHASE 4: Runtime Parse Worker Result -->
  <!-- ============================================================ -->
  <rect x="20" y="814" width="1160" height="24" rx="4" fill="#D97706" opacity="0.08"/>
  <text x="600" y="811" text-anchor="middle" font-size="12" font-weight="700" fill="#9A3412">Phase 4: Runtime 解析 Worker JSON → 更新状态</text>

  <!-- 4.1 parse_handoff_json -->
  <rect x="245" y="826" width="160" height="36" rx="3" fill="#FED7AA"/>
  <text x="325" y="840" text-anchor="middle" font-size="10" fill="#7C2D12" font-weight="600">parse_handoff_json()</text>
  <text x="325" y="855" text-anchor="middle" font-size="8.5" fill="#7C2D12">验证 → 合并 → dispatch</text>
  <path d="M535,826 L335,826" stroke="#D97706" stroke-width="1.2" fill="none" marker-end="url(#a-run)"/>

  <!-- 4.2 consume_worker_done -->
  <rect x="245" y="872" width="180" height="18" rx="3" fill="#FED7AA"/>
  <text x="335" y="885" text-anchor="middle" font-size="9.5" fill="#7C2D12">consume_worker_done()</text>

  <!-- 4.3 UPDATE worker completed -->
  <path d="M335,894 L735,894" stroke="#D97706" stroke-width="1.5" fill="none" marker-end="url(#a-run)"/>
  <text x="470" y="890" font-size="8.5" fill="#D97706">⑳ UPDATE worker status=completed, completion_summary, evidence_paths</text>

  <text x="335" y="910" font-size="8.5" fill="#6B7280">(worker_done 不自动标记 consumed，等待 manager 下条 handoff)</text>

  <!-- ============================================================ -->
  <!-- PHASE 5: Next Manager Patrol -->
  <!-- ============================================================ -->
  <rect x="20" y="946" width="1160" height="24" rx="4" fill="#2563EB" opacity="0.12"/>
  <text x="600" y="943" text-anchor="middle" font-size="12" font-weight="700" fill="#1E40AF">Phase 5: Manager 下轮 Patrol → 消费 Worker 结果</text>

  <!-- 5.1 Manager sees completed workers -->
  <path d="M125,956 L745,956" stroke="#2563EB" stroke-width="1.2" fill="none" marker-end="url(#a-mgr)"/>
  <text x="400" y="952" font-size="8.5" fill="#2563EB">㉑ 查 handoffs: 看到 worker completed (consumed_by='')</text>

  <!-- 5.2 Manager decides -->
  <path d="M125,974 L125,996" stroke="#2563EB" stroke-width="1.2" fill="none"/>
  <text x="44" y="990" font-size="8.5" fill="#2563EB">㉒ 决策: 继续委派 / resume_manager / stop_ai</text>

  <!-- 5.3 Manager outputs new handoff JSON -->
  <path d="M135,1010 L315,1010" stroke="#2563EB" stroke-width="1.5" fill="none" marker-end="url(#a-mgr)"/>
  <text x="190" y="1006" font-size="8.5" fill="#2563EB">㉓ 输出新的 ```handoff JSON</text>

  <!-- 5.4 Runtime parse new handoff -->
  <rect x="245" y="1022" width="160" height="18" rx="3" fill="#FED7AA"/>
  <text x="325" y="1035" text-anchor="middle" font-size="9.5" fill="#7C2D12">parse_handoff_json()</text>
  <path d="M315,1022 L325,1022" stroke="#D97706" stroke-width="1.2" fill="none"/>

  <!-- 5.5 Auto-consume -->
  <path d="M335,1046 L735,1046" stroke="#7C3AED" stroke-width="2" fill="none" marker-end="url(#a-run)"/>
  <text x="470" y="1042" font-size="9" fill="#7C3AED" font-weight="600">㉔ 自动消费: UPDATE 所有 unconsumed worker → status=consumed, consumed_by=manager</text>

  <path d="M335,1062 L525,1062" stroke="#D97706" stroke-width="1.2" fill="none" marker-end="url(#a-run)"/>
  <text x="400" y="1058" font-size="8.5" fill="#D97706">㉕ 继续循环 → 回到 Phase 2 (或 Phase 1)</text>

  <!-- ============================================================ -->
  <!-- EDGE CASES -->
  <!-- ============================================================ -->
  <rect x="20" y="1100" width="1160" height="220" rx="6" fill="#1E293B"/>
  <text x="50" y="1124" font-size="12" font-weight="700" fill="#F1F5F9">边界情况</text>

  <!-- Case 1: Repair -->
  <rect x="40" y="1138" width="550" height="62" rx="4" fill="#450A0A"/>
  <text x="55" y="1158" font-size="11" font-weight="700" fill="#FCA5A5">路径 A: JSON 无效 → 结构化修复 handoff</text>
  <text x="55" y="1175" font-size="9.5" fill="#FCA5A5">parse_handoff_json 验证失败 → Runtime INSERT repair record (含 repair_target_role, validation_errors_json)</text>
  <text x="55" y="1190" font-size="9.5" fill="#FCA5A5">→ Manager 下轮 patrol 读结构化字段 → delta turn 向同会话发送修正指令</text>

  <!-- Case 2: Stale -->
  <rect x="610" y="1138" width="550" height="62" rx="4" fill="#450A0A"/>
  <text x="625" y="1158" font-size="11" font-weight="700" fill="#FCA5A5">路径 B: Worker 不活跃 → stale → blocked</text>
  <text x="625" y="1175" font-size="9.5" fill="#FCA5A5">mark_stale: last_activity_at 超阈值（非总运行时长）→ UPDATE status=blocked</text>
  <text x="625" y="1190" font-size="9.5" fill="#FCA5A5">→ Manager 下轮 patrol 看到 blocked → re-dispatch / superseded / 收口</text>

  <!-- Case 3: Resume -->
  <rect x="40" y="1210" width="550" height="48" rx="4" fill="#450A0A"/>
  <text x="55" y="1230" font-size="11" font-weight="700" fill="#FCA5A5">路径 C: resume_manager / stop_ai</text>
  <text x="55" y="1247" font-size="9.5" fill="#FCA5A5">resume_manager: UPDATE manager=completed → 消费 unconsumed workers → 继续 patrol</text>
  <text x="55" y="1262" font-size="9.5" fill="#FCA5A5">stop_ai: UPDATE manager=completed → 消费 unconsumed workers → 通知 supervisor 退出</text>

  <!-- Case 4: Worker handoff_needed -->
  <rect x="610" y="1210" width="550" height="48" rx="4" fill="#450A0A"/>
  <text x="625" y="1230" font-size="11" font-weight="700" fill="#FCA5A5">路径 D: worker_handoff_needed (会话保持, delta 继续)</text>
  <text x="625" y="1247" font-size="9.5" fill="#FCA5A5">worker_handoff_needed: UPDATE worker=completed, 会话不关闭, 等 Manager delta turn</text>
  <text x="625" y="1262" font-size="9.5" fill="#FCA5A5">worker_blocked: UPDATE worker=blocked → Manager 下轮 patrol 判断</text>

  <!-- Key insight -->
  <rect x="40" y="1270" width="1120" height="30" rx="3" fill="#312E81"/>
  <text x="600" y="1290" text-anchor="middle" font-size="10.5" fill="#C7D2FE" font-weight="600">核心保证: AI 输出一个 JSON → Runtime 单次解析写入。scan 过滤活跃 Worker，Manager 拿到干净结果。</text>

</svg>

[package]
name = "freely-probe-bridge"
version = "0.1.0"
edition = "2021"
description = "Day-1 Rust/Tauri bridge for Freely Probe"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
time = { version = "0.3", features = ["formatting"] }

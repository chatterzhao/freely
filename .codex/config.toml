# Freely 项目级 Codex 配置
# Reference: https://developers.openai.com/codex/config-reference/
#
# 实际完整配置在 slot 目录: /Users/zhaoyu/.ai-auth/cc-use-codex-cli/config.toml
# 本文件仅放项目级覆盖字段，方便用户快速修改。
# 其余字段（openai_base_url / auth / provider）在 slot 配置中。
# 修改后生效于下次 codex session，无需重启 freely。

# ── 默认模型 ── (方便快速修改，会覆盖 slot 的 model)
model = "gpt-5.5"

# ── 批准策略 ──────────────────────────────────────────
# "never"        — 自动批准所有操作（Freely auto 模式默认）
# "on-failure"   — 仅命令失败时请求批准
# "on-request"   — 命令请求批准时询问（step 模式默认）
# "always"       — 始终需要手动批准
approval_policy = "never"

# ── 沙箱模式 ──────────────────────────────────────────
# "read-only"         — 只读，禁止修改文件系统
# "workspace-write"   — 项目目录可写（推荐）
# "danger-full-access" — 完全访问，无限制
sandbox_mode = "workspace-write"

# ── 沙箱网络 ──────────────────────────────────────────
# true = 允许命令访问网络, false = 禁止
# 注意: 此字段在 [sandbox_workspace_write] 段下，
# 自由模式或 danger 模式需另设全局 network_access。
[sandbox_workspace_write]
network_access = false

# ── 额外可写路径 ──────────────────────────────────────
# 项目 worktrees 目录在项目根外，需显式放行
writable_roots = ["/Users/zhaoyu/Downloads/code/my-freely/freely-worktrees"]

# ── 上下文管理 ────────────────────────────────────────
# 控制 session 上下文预算，超限触发 compaction
model_context_window = 200000
model_auto_compact_token_limit = 150000
project_doc_max_bytes = 32768

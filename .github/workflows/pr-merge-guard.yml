# CI guard: block GitHub Merge button and enforce the correct merge workflow.
#
# How this works:
#   1. This workflow creates a check named "governance/pr-merge-guard" in "in_progress" state.
#   2. GitHub branch protection on develop requires this check to pass.
#   3. Only pr-merge-guarded (running locally) can set this check to "success" via GitHub API.
#   4. Result: GitHub UI "Merge pull request" button is greyed out until pr-merge-guarded runs.
#
# Branch protection setup (repo admin, one-time):
#   Settings → Branches → Add rule for "develop":
#     ☑ Require status checks to pass before merging
#       Search: "governance/pr-merge-guard"
#     ☑ Do not allow bypassing the above settings
#
# Correct merge workflow:
#   ./bin/pr-merge-guarded develop <source-branch>
#   (NOT the GitHub Merge button)

name: PR Merge Guard

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Create blocking governance check
        uses: actions/github-script@v7
        with:
          script: |
            const { data: checkRun } = await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'governance/pr-merge-guard',
              head_sha: context.payload.pull_request.head.sha,
              status: 'in_progress',
              output: {
                title: 'Governance gates pending',
                summary: 'This PR must be merged via pr-merge-guarded, not the GitHub UI.\n\n' +
                         'Run: ./bin/pr-merge-guarded develop ' + context.payload.pull_request.head.ref + '\n\n' +
                         'The pr-merge-guarded script will run all governance gates and set this check to success.'
              }
            });
            console.log(`Created check run ${checkRun.id} — merge blocked until pr-merge-guarded sets it to success`);

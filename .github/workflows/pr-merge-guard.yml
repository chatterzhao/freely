# CI guard: block GitHub Merge button and enforce the correct merge workflow.
#
# ── How this works ──────────────────────────────────────────────
#   1. This workflow creates a check "governance/pr-merge-guard" (in_progress).
#   2. Branch protection on develop REQUIRES this check to pass.
#   3. Only pr-merge-guarded sets it to "success" via GitHub API.
#   4. Result: GitHub UI merge button is greyed out.
#
# ── One-time setup (after `freely init`) ────────────────────────
#   Run this ONCE to enable branch protection on develop:
#
#     gh api repos/{owner}/{repo}/branches/develop/protection \
#       --method PUT --input - <<'JSON'
#     {
#       "required_status_checks": {
#         "strict": true,
#         "contexts": ["governance/pr-merge-guard"]
#       },
#       "enforce_admins": true,
#       "required_pull_request_reviews": null,
#       "restrictions": null,
#       "allow_force_pushes": false,
#       "allow_deletions": false
#     }
#     JSON
#
#   Or via UI: Settings → Branches → Add rule → "develop"
#     ☑ Require status checks → search "governance/pr-merge-guard"
#     ☑ Require branches to be up to date before merging
#     ☑ Include administrators (enforce_admins: true)
#         ↑ THIS IS CRITICAL — prevents gh pr merge --admin bypass
#
# ── Correct merge workflow ──────────────────────────────────────
#   ./bin/pr-merge-guarded develop <source-branch>
#   (NEVER the GitHub Merge button)

name: PR Merge Guard

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Create blocking governance check
        uses: actions/github-script@v7
        with:
          script: |
            const { data: checkRun } = await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'governance/pr-merge-guard',
              head_sha: context.payload.pull_request.head.sha,
              status: 'in_progress',
              output: {
                title: 'Governance gates pending',
                summary: 'This PR must be merged via pr-merge-guarded, not the GitHub UI.\n\n' +
                         'Run: ./bin/pr-merge-guarded develop ' + context.payload.pull_request.head.ref + '\n\n' +
                         'The pr-merge-guarded script will run all governance gates and set this check to success.'
              }
            });
            console.log(`Created check run ${checkRun.id} — merge blocked until pr-merge-guarded sets it to success`);

  # Real verification job (#4151). The guard above only creates a blocking
  # check; this job actually executes the verified local test subset so a PR
  # carries machine evidence instead of a status claim.
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run verifiable test subset
        run: bash bin/test-all --ci


- insert:
    - id: dsh-freely
      name: '@freely/dsh-freely'
    - id: freely-manager-preset
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: freely-manager
        name: Freely Manager
        description: Freely Manager; read-only tools
        order: 90
        plugins:
          - id: freely-manager-persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: 'You are the Freely Manager. Follow project intent, constitution, laws, gates, skills, and tools.'
          - id: freely-manager-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: freely-manager-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
    - id: freely-worker-preset
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: freely-worker
        name: Freely Worker
        description: Freely Worker; read/write/edit tools
        order: 91
        plugins:
          - id: freely-worker-persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: 'You are the Freely Worker. Follow project intent, constitution, laws, gates, skills, and tools.'
          - id: freely-worker-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: freely-worker-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
    - id: freely-reviewer-preset
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: freely-reviewer
        name: Freely Reviewer
        description: Freely Reviewer; read-only independent review
        order: 92
        plugins:
          - id: freely-reviewer-persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: 'You are the Freely Reviewer. Review independently; do not modify implementation.'
          - id: freely-reviewer-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: freely-reviewer-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
